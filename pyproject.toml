
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analysis"
version = "0.1.0"
description = "Log analysis pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "psycopg2-binary>=2.9.13",
    "requests>=2.34.2",
]

[tool.setuptools.packages.find]
include = ["ingestion*", "processing*", "storage*", "serving*"]
